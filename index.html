<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGA Sightings</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AGA Sightings">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B1D14; --earth:#5C3D1E; --burgundy:#7A2230; --gold:#C9A96E;
    --parchment:#F4E9D8; --paper:#FFFDF8; --sage:#5E7148; --line:#E3D2B8; --muted:#8A7560;
    --serif:'Fraunces',Georgia,serif; --sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  .savebar:not(.on){visibility:hidden}
  @media (max-width:480px){ .brand h1 small{display:none} .brand h1{font-size:1.2rem} .tab{padding:9px 0 10px} }
  html,body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--burgundy);outline-offset:2px}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}

  /* Header */
  header{background:var(--earth);color:#fff;padding:0}
  .logo-band{background:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:3px solid var(--gold)}
  .logo-band img{display:block;height:48px;width:auto;max-width:100%}
  header .brand{padding-top:12px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.2px}
  .brand h1 small{display:block;font-family:var(--sans);font-weight:400;font-size:.8rem;opacity:.75}
  .course-pick select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:8px 10px;max-width:180px}
  .course-pick option{color:var(--ink)}
  .tabs{display:flex;gap:4px;margin-top:14px}
  .tab{flex:1;background:none;border:none;color:rgba(255,255,255,.7);padding:11px 0 12px;font-weight:600;border-bottom:3px solid transparent}
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--gold)}
  .status{font-size:.8rem;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
  .status.warn{background:var(--gold);color:var(--ink)}
  .status{border:none;color:#fff}
  .status.warn{color:var(--ink)}

  section.view{display:none;padding:16px 0 120px}
  section.view.on{display:block}

  /* Log: context */
  .ctx{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ctx label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
  .ctx .full{grid-column:1/-1}
  .ctx select,.ctx input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{flex:1;border:none;background:none;padding:10px 4px;font-size:.92rem}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--earth);color:#fff}

  .cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.92rem}
  .chip[aria-pressed="true"]{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
  .chip .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:.78rem}

  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
  .splist{list-style:none;margin:10px 0 0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sp{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .sp:last-child{border-bottom:none}
  .sp .tick{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:.85rem}
  .sp.sel{background:#F7EEE0}
  .sp.sel .tick{background:var(--burgundy);border-color:var(--burgundy)}
  .sp .nm{flex:1;min-width:0}
  .sp .nm .cat{display:block;font-size:.76rem;color:var(--muted)}
  .pts{flex:none;font-size:.75rem;font-weight:600;color:var(--earth);background:#EFE1C9;border-radius:6px;padding:2px 7px}
  .pts.one{background:#F3EBDF;color:var(--muted);font-weight:500}
  .have{flex:none;font-size:.75rem;color:var(--sage)}
  .step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff}
  .step button{border:none;background:none;width:34px;height:32px;font-size:1.1rem}
  .step span{min-width:24px;text-align:center;font-weight:600}
  .addnew{display:block;width:100%;margin-top:10px;background:none;border:1px dashed var(--gold);border-radius:10px;padding:12px;color:var(--earth)}

  .savebar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(43,29,20,.08);transform:translateY(110%);transition:transform .2s}
  .savebar.on{transform:none}
  .savebar .wrap{display:flex;align-items:center;gap:12px}
  .savebar .sum{flex:1;font-size:.95rem}
  .btn{border:none;border-radius:10px;padding:13px 20px;font-weight:600;background:var(--burgundy);color:#fff}
  .btn.ghost{background:none;color:var(--earth);padding:13px 8px}

  /* Results */
  .rbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .rbar select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .rbar .seg{flex:1;min-width:230px}
  .hero{margin:18px 0 8px}
  .hero .big{font-family:var(--serif);font-weight:700;font-size:3.6rem;line-height:1;color:var(--burgundy)}
  .hero p{margin:6px 0 0;color:var(--earth)}
  .tally{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
  .tally div{background:var(--paper);padding:10px 12px}
  .tally b{display:block;font-family:var(--serif);font-size:1.4rem}
  .tally span{font-size:.8rem;color:var(--muted)}

  h2{font-family:var(--serif);font-weight:500;font-size:1.25rem;margin:30px 0 4px}
  .sub{margin:0 0 12px;color:var(--muted);font-size:.88rem}

  .board{list-style:none;margin:0;padding:0}
  .row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row .rk{font-family:var(--serif);font-size:1.15rem;color:var(--muted);text-align:center}
  .row .gn{font-weight:600}
  .row .gn em{font-style:normal;font-weight:500;font-size:.75rem;color:#fff;background:var(--burgundy);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .row .meta{font-size:.8rem;color:var(--muted)}
  .row .sc{font-family:var(--serif);font-weight:700;font-size:1.6rem}
  .track{grid-column:2/-1;height:10px;background:#EADBC3;border-radius:999px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:999px;transition:width .5s}

  .tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:.92rem}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{font-weight:600;color:var(--earth);background:#F7EEE0}
  tr:last-child td{border-bottom:none}
  td.lead{font-weight:700;color:var(--burgundy)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}

  .excl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .excl div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .excl h3{margin:0 0 6px;font-size:.95rem}
  .excl ul{margin:0;padding-left:18px;font-size:.9rem}

  .check h3{font-size:.95rem;margin:18px 0 6px;color:var(--earth)}
  .check ul{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
  .check li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.92rem}
  .check li:last-child{border-bottom:none}
  .check li .nm{flex:1}
  .check li .fs{font-size:.78rem;color:var(--muted)}
  .check .dots{display:flex;gap:3px}
  .check .dots .dot{margin:0}

  .recent{list-style:none;margin:0;padding:0}
  .recent li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .recent .nm{flex:1}
  .recent .nm small{display:block;color:var(--muted);font-size:.78rem}
  .recent .wait{font-size:.75rem;color:var(--ink);background:var(--gold);border-radius:6px;padding:2px 7px}
  .del{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--burgundy)}
  .del.arm{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}

  .empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:10}
  .toast.on{opacity:1}
  .loading{padding:40px 0;text-align:center;color:var(--muted)}

  @media (min-width:700px){ .ctx{grid-template-columns:repeat(4,1fr)} .ctx .half{grid-column:span 2} }
  .brand .id{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{height:46px;width:auto;max-width:120px;object-fit:contain;background:#fff;border-radius:8px;padding:4px}
  .me-name{font-family:var(--serif);font-size:1.3rem;margin:18px 0 0}
  .times{font-size:.78rem;color:var(--muted);white-space:nowrap}
  .more{display:block;margin:10px auto 0;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--earth)}
  .printbtn{padding:9px 14px;font-size:.92rem}

  /* ── Printed report (A4) ── */
  #print-sheet{display:none;color:#2B1D14;font-family:var(--sans);font-size:9.5pt;line-height:1.35}
  .ps-page{width:186mm}
  .ps-page + .ps-page{break-before:page;page-break-before:always}
  .ps-head{display:flex;align-items:center;justify-content:space-between;gap:10mm;padding-bottom:4mm;border-bottom:1.2mm solid var(--gold);margin-bottom:5mm}
  .ps-head img{height:17mm;width:auto}
  .ps-title{text-align:right}
  .ps-title h1{font-family:var(--serif);font-size:20pt;margin:0;color:var(--burgundy);line-height:1.1}
  .ps-title p{margin:1mm 0 0;font-size:10pt;color:#5a4636}
  .ps-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-bottom:3mm}
  .ps-kpi{background:var(--burgundy);color:#fff;border-radius:2.5mm;padding:3mm 4mm}
  .ps-kpi b{display:block;font-family:var(--serif);font-size:22pt;line-height:1}
  .ps-kpi span{font-size:8.5pt;opacity:.9}
  .ps-cats{display:grid;grid-template-columns:repeat(6,1fr);gap:2mm;margin-bottom:5mm}
  .ps-cats div{border:0.3mm solid #E3D2B8;border-radius:2mm;padding:2mm 3mm;background:#FBF6EF}
  .ps-cats b{display:block;font-family:var(--serif);font-size:14pt;color:var(--gold)}
  .ps-cats span{font-size:7.5pt;color:#6b5746}
  .ps-cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-bottom:5mm}
  .ps-sec{break-inside:avoid}
  .ps-tbl td.nm small{display:inline;margin-left:1.5mm}
  .ps-sec h2{font-family:var(--serif);font-weight:700;font-size:12pt;color:var(--burgundy);margin:0 0 2mm;padding-bottom:1mm;border-bottom:0.3mm solid #E3D2B8}
  .ps-sec .note{font-size:7.5pt;color:#8A7560;margin:-1mm 0 2mm}
  .ps-tbl{width:100%;border-collapse:collapse;font-size:9pt}
  .ps-tbl th{font-weight:600;color:#5a4636;text-align:right;padding:1.2mm 1.5mm;border-bottom:0.3mm solid #E3D2B8;font-size:8pt}
  .ps-tbl td{padding:1mm 1.5mm;text-align:right;border-bottom:0.2mm solid #EFE3D1;white-space:nowrap}
  .ps-tbl th:first-child,.ps-tbl td:first-child{text-align:left}
  .ps-tbl td.nm{text-align:left;white-space:normal;font-weight:600}
  .ps-tbl td.nm small{font-weight:400;color:#8A7560;font-size:7.5pt}
  .ps-tbl tr.win td{background:#F7EEE0}
  .ps-rank{display:inline-block;width:5.5mm;height:5.5mm;line-height:5.5mm;border-radius:50%;text-align:center;font-weight:700;font-size:8pt;background:#EFE3D1}
  .ps-rank.r1{background:var(--gold);color:#fff}
  .ps-bar{height:2mm;background:#EFE3D1;border-radius:1mm;margin-top:1mm;overflow:hidden}
  .ps-bar i{display:block;height:100%}
  .ps-chart{margin-bottom:5mm}
  .ps-chart svg{width:100%;height:auto;display:block}
  .ps-star{display:grid;grid-template-columns:1fr auto;gap:0 3mm;padding:1.3mm 0;border-bottom:0.2mm solid #EFE3D1}
  .ps-star b{font-weight:600}
  .ps-star small{grid-column:1/-1;color:#8A7560;font-size:7.5pt}
  .ps-star span{font-weight:700;color:var(--burgundy)}
  .ps-excl{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
  .ps-excl div{break-inside:avoid;border:0.3mm solid #E3D2B8;border-radius:2mm;padding:2mm 3mm;font-size:8.5pt}
  .ps-excl b{display:block;margin-bottom:1mm}
  .ps-dot{display:inline-block;width:2.4mm;height:2.4mm;border-radius:50%;margin-right:1.2mm;vertical-align:0}
  .ps-list{columns:3;column-gap:6mm;font-size:8.5pt}
  .ps-list h3{break-after:avoid;font-size:9.5pt;color:var(--burgundy);margin:0 0 1mm;padding-top:2mm;font-family:var(--serif)}
  .ps-list p{margin:0;padding:.6mm 0;break-inside:avoid;display:flex;justify-content:space-between;gap:2mm;border-bottom:0.2mm solid #F1E7D8}
  .ps-foot{margin-top:5mm;padding-top:2mm;border-top:0.3mm solid #E3D2B8;font-size:7.5pt;color:#8A7560;display:flex;justify-content:space-between}
  @media print{
    @page{size:A4 portrait;margin:12mm}
    html,body{background:#fff!important}
    header,main,.savebar,.toast{display:none!important}
    #print-sheet{display:block}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header>
  <div class="logo-band"><div class="wrap"><img src="logo.png" alt="African Guide Academy" onerror="this.closest('.logo-band').remove()"></div></div>
  <div class="wrap">
    <div class="brand">
      <h1>Sightings<small>Game drive and walk log</small></h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="status" class="status" onclick="syncNow()">Checking…</button>
        <div class="course-pick"><select id="course" aria-label="Course"></select></div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-log" aria-selected="true" onclick="showView('log')">Log</button>
      <button class="tab" role="tab" id="tab-res" aria-selected="false" onclick="showView('res')">Results</button>
      <button class="tab" role="tab" id="tab-me" aria-selected="false" onclick="showView('me')">My list</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- LOG -->
  <section class="view on" id="view-log">
    <div id="log-loading" class="loading">Loading species list…</div>
    <div id="log-body" hidden>
      <div class="ctx">
        <div class="half"><label for="name">Your name</label><input id="name" placeholder="First and last name" autocomplete="name"></div>
        <div class="half"><label for="group">Group</label><select id="group"></select></div>
        <div class="full" id="groupform" hidden><label for="newgroup">New group name</label>
          <div style="display:flex;gap:8px"><input id="newgroup" placeholder="e.g. Pangolin" autocomplete="off"><button class="btn" id="groupok" type="button">Add</button><button class="btn ghost" id="groupcancel" type="button">Cancel</button></div></div>
        <div class="half"><label for="date">Date</label><input type="date" id="date"></div>
        <div class="half"><label>Activity</label>
          <div class="seg" id="activity"><button aria-pressed="true">Drive</button><button aria-pressed="false">Walk</button></div></div>
        <div class="half"><label>Session</label>
          <div class="seg" id="session"><button aria-pressed="true">Morning</button><button aria-pressed="false">Afternoon</button><button aria-pressed="false">Night</button></div></div>
        <div class="full"><label for="notes">Notes (optional, saved with each sighting)</label><input id="notes" placeholder="e.g. Xakanaxa lagoon, kill site"></div>
      </div>

      <div class="cats" id="cats"></div>
      <input class="search" id="q" type="search" placeholder="Search all species" autocomplete="off">
      <ul class="splist" id="splist"></ul>
      <button class="addnew" id="addnew">Add a species that's not listed</button>
      <div class="ctx" id="addform" hidden style="margin-top:10px">
        <div class="half"><label for="newname">Species name</label><input id="newname" placeholder="e.g. Bushveld Gerbil"></div>
        <div class="half"><label for="newcat">Category</label><select id="newcat"></select></div>
        <div class="full" style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" id="addcancel">Cancel</button><button class="btn" id="addok">Add and select</button></div>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="view" id="view-res">
    <div class="rbar">
      <select id="period" aria-label="Period"></select>
      <div class="seg" id="score">
        <button aria-pressed="true" data-m="species">Species</button>
        <button aria-pressed="false" data-m="points">Points</button>
        <button aria-pressed="false" data-m="sightings">Sightings</button>
      </div>
      <button class="btn printbtn" type="button" onclick="printResults()">Print / PDF</button>
    </div>
    <div id="res-body"><div class="loading">Loading results…</div></div>
  </section>

  <!-- MY LIST -->
  <section class="view" id="view-me">
    <div id="me-body"></div>
  </section>
</main>

<div class="savebar" id="savebar">
  <div class="wrap">
    <div class="sum" id="sum"></div>
    <button class="btn ghost" onclick="clearSel()">Clear</button>
    <button class="btn" id="saveBtn" onclick="saveSel()">Save sightings</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="print-sheet"></div>

<script>
const COLORS = ['#7A2230','#5E7148','#B07A2A','#3F6B7A','#A0522D','#6B4C7A','#2F5D50','#8A6D3B'];
const QKEY = 'aga_sight_queue', PKEY = 'aga_sight_prefs', CKEY = 'aga_sight_cfg', RKEY = 'aga_sight_res_', SKEY = 'aga_sight_synced';

let cfg = null, results = null, cat = 'Mammals', query = '', scoreMode = 'species', period = 'all';
const sel = new Map();
let queue = load(QKEY, []), prefs = load(PKEY, {}), sending = false, armed = null;

// ── colours from config.js ──
(function(){
  const t = window.AGA_CONFIG && AGA_CONFIG.THEME; if (!t) return;
  const r = document.documentElement.style;
  if (t.header) r.setProperty('--earth', t.header);
  if (t.accent) r.setProperty('--burgundy', t.accent);
  if (t.highlight) r.setProperty('--gold', t.highlight);
  if (t.background) r.setProperty('--parchment', t.background);
  if (t.accent) COLORS[0] = t.accent;
  if (t.highlight) COLORS[2] = t.highlight;
})();

// ── helpers ──
function norm(n){ return String(n || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
function tidyName(n){ n = String(n || '').trim().replace(/\s+/g, ' '); return n === n.toLowerCase() ? n.replace(/(^|[\s-])\S/g, c => c.toUpperCase()) : n; }
function myName(){ return norm($('name').value || prefs.name); }
function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function key(c, s){ return (String(c).trim() + '|' + String(s).trim()).toLowerCase(); }
function today(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function niceDate(s){ const p = s.split('-'); const d = new Date(p[0], p[1]-1, p[2]); return d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}); }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function segVal(id){ const b = $(id).querySelector('[aria-pressed="true"]'); return b ? b.textContent : ''; }
function wireSeg(id, fn){ $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
  $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (fn) fn(b); }); }
function courseObj(){ return cfg.courses.find(c => c.code === $('course').value) || {code:'', groups:[]}; }
function groupsForCourse(rows){
  const gs = courseObj().groups.slice();
  rows.forEach(r => { if (r.group && !gs.includes(r.group)) gs.push(r.group); });
  return gs;
}
function colorOf(g, gs){ const i = gs.indexOf(g); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; }

// ── talking to the Google Sheet ──
function api(action, data){
  const cfgOk = window.AGA_CONFIG && AGA_CONFIG.API_URL && AGA_CONFIG.API_URL.indexOf('/exec') > 0;
  if (!cfgOk) return Promise.reject(new Error('API_URL is not set in config.js'));
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 45000);
  return fetch(AGA_CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, key: AGA_CONFIG.APP_KEY }, data || {})), signal: ctl.signal })
    .then(r => r.json())
    .then(j => { clearTimeout(t); if (j.error) throw new Error(j.error); return j; })
    .catch(e => { clearTimeout(t); throw e; });
}

// ── start: use what's saved on the phone straight away, then refresh if there's signal ──
(function start(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const cached = load(CKEY, null);
  if (cached) applyConfig(cached);
  api('config').then(c => { store(CKEY, c); applyConfig(c); })
    .catch(err => {
      if (!cfg) $('log-loading').textContent = /API_URL|app key/i.test(err.message)
        ? 'Setup problem: ' + err.message
        : 'First time on this phone: connect to camp Wi-Fi once so the app can download the species list.';
    });
  setInterval(() => { flush(); }, 30000);
  window.addEventListener('online', syncNow);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
})();

function applyConfig(c){
  const first = !cfg;
  cfg = c;
  // keep species typed in on this phone that haven't reached the sheet yet
  queue.forEach(q => { if (!cfg.species.some(s => key(s.category, s.name) === key(q.category, q.species))) cfg.species.push({ category: q.category, name: q.species, points: 1 }); });
  if (!cfg.courses.length){ $('log-loading').hidden = false; $('log-body').hidden = true; $('log-loading').textContent = 'No active courses. Add one in the Courses sheet.'; return; }
  const keep = $('course').value || prefs.course;
  $('course').innerHTML = cfg.courses.map(x => '<option>' + esc(x.code) + '</option>').join('');
  if (keep && cfg.courses.some(x => x.code === keep)) $('course').value = keep;
  $('newcat').innerHTML = cfg.categories.map(c => '<option>' + esc(c) + '</option>').join('');
  fillGroups();
  if (first){
    $('course').onchange = () => { prefs.course = $('course').value; store(PKEY, prefs); fillGroups(); sel.clear(); results = null; renderLog(); loadResults(); };
    $('date').value = today();
    $('name').value = prefs.name || '';
    $('groupok').onclick = addGroup;
    $('groupcancel').onclick = () => { $('groupform').hidden = true; };
    $('newgroup').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); addGroup(); } };
    $('name').onchange = () => { const n = tidyName($('name').value); $('name').value = n; prefs.name = n; store(PKEY, prefs); renderList(); renderMe(); };
    wireSeg('activity'); wireSeg('session');
    wireSeg('score', b => { scoreMode = b.dataset.m; renderResults(); });
    $('period').onchange = () => { period = $('period').value; renderResults(); };
    $('q').oninput = () => { query = $('q').value.trim().toLowerCase(); renderList(); };
    $('addnew').onclick = () => { $('addform').hidden = false; $('newname').value = $('q').value.trim(); $('newcat').value = cat; $('newname').focus(); };
    $('addcancel').onclick = () => { $('addform').hidden = true; };
    $('addok').onclick = addCustom;
    const h = new Date().getHours();
    const s = h >= 19 || h < 4 ? 'Night' : h >= 12 ? 'Afternoon' : 'Morning';
    $('session').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.textContent === s));
    $('log-loading').hidden = true; $('log-body').hidden = false;
    flush();
  }
  renderLog(); loadResults(); updateStatus();
}

function syncNow(){ flush(); loadResults(); }

// Groups: the Courses sheet list, plus any group added on this phone or used in unsent sightings
function groupList(){
  const code = $('course').value, gs = courseObj().groups.slice();
  const add = g => { if (g && !gs.some(x => norm(x) === norm(g))) gs.push(g); };
  ((prefs.newGroups || {})[code] || []).forEach(add);
  queue.filter(q => q.course === code).forEach(q => add(q.group));
  return gs;
}
function fillGroups(){
  const gs = groupList();
  $('group').innerHTML = (gs.length ? '' : '<option value="">Choose your group</option>') +
    gs.map(g => '<option>' + esc(g) + '</option>').join('') + '<option value="__new__">+ Add a new group…</option>';
  $('group').value = prefs.group && gs.includes(prefs.group) ? prefs.group : (gs[0] || '');
  $('group').onchange = () => {
    if ($('group').value === '__new__'){
      $('group').value = prefs.group && gs.includes(prefs.group) ? prefs.group : (gs[0] || '');
      $('groupform').hidden = false; $('newgroup').value = ''; $('newgroup').focus(); return;
    }
    prefs.group = $('group').value; store(PKEY, prefs); renderList();
  };
}
function addGroup(){
  const code = $('course').value;
  let g = tidyName($('newgroup').value);
  if (!g){ $('newgroup').focus(); return; }
  const existing = groupList().find(x => norm(x) === norm(g));
  if (existing) g = existing;
  else { prefs.newGroups = prefs.newGroups || {}; (prefs.newGroups[code] = prefs.newGroups[code] || []).push(g); }
  prefs.group = g; store(PKEY, prefs);
  $('groupform').hidden = true; fillGroups(); renderList();
  toast(existing ? 'Switched to ' + g : 'Group ' + g + ' added. Everyone sees it once your sightings sync.');
}

// ── LOG ──
function showView(v){
  ['log', 'res', 'me'].forEach(x => { $('view-' + x).classList.toggle('on', v === x); $('tab-' + x).setAttribute('aria-selected', v === x); });
  updateBar();
  if (v === 'res') renderResults();
  if (v === 'me') renderMe();
  window.scrollTo(0, 0);
}

function renderLog(){ renderCats(); renderList(); updateBar(); }

function renderCats(){
  $('cats').innerHTML = cfg.categories.map(c => {
    let n = 0; sel.forEach(v => { if (v.category === c) n++; });
    return '<button class="chip" aria-pressed="' + (c === cat && !query) + '" data-c="' + esc(c) + '">' + esc(c) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
  $('cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = b.dataset.c; query = ''; $('q').value = ''; renderCats(); renderList(); });
}

function groupHas(){
  const me = myName(), g = $('group').value, set = new Set();
  allRows().forEach(r => { if (me ? norm(r.observer) === me : r.group === g) set.add(key(r.category, r.species)); });
  return set;
}

function renderList(){
  const have = groupHas();
  let list = query ? cfg.species.filter(s => s.name.toLowerCase().includes(query)) : cfg.species.filter(s => s.category === cat);
  list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length){
    $('splist').innerHTML = '<li class="empty">' + (query ? 'No species match "' + esc($('q').value) + '". Use the button below to add it.' : 'No species in this category yet.') + '</li>';
    return;
  }
  $('splist').innerHTML = list.map(s => {
    const k = key(s.category, s.name), on = sel.get(k);
    return '<li class="sp' + (on ? ' sel' : '') + '" data-k="' + esc(k) + '" role="checkbox" aria-checked="' + !!on + '" tabindex="0">' +
      '<span class="tick">' + (on ? '✓' : '') + '</span>' +
      '<span class="nm">' + esc(s.name) + (query ? '<span class="cat">' + esc(s.category) + '</span>' : '') + '</span>' +
      (have.has(k) ? '<span class="have">On your list</span>' : '') +
      '<span class="pts' + (s.points > 1 ? '' : ' one') + '">' + s.points + (s.points === 1 ? ' pt' : ' pts') + '</span>' +
      (on ? '<span class="step"><button data-d="-1" aria-label="Fewer">−</button><span>' + on.count + '</span><button data-d="1" aria-label="More">+</button></span>' : '') +
      '</li>';
  }).join('');
  $('splist').querySelectorAll('.sp').forEach(li => {
    const k = li.dataset.k;
    const toggle = () => {
      if (sel.has(k)) sel.delete(k);
      else { const s = cfg.species.find(x => key(x.category, x.name) === k); sel.set(k, {category:s.category, species:s.name, count:1}); }
      renderCats(); renderList(); updateBar();
    };
    li.onclick = toggle;
    li.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggle(); } };
    li.querySelectorAll('.step button').forEach(b => b.onclick = e => {
      e.stopPropagation(); const v = sel.get(k); v.count = Math.max(1, v.count + Number(b.dataset.d)); renderList(); });
  });
}

function addCustom(){
  const name = $('newname').value.trim(), c = $('newcat').value;
  if (!name){ $('newname').focus(); return; }
  const k = key(c, name);
  if (!cfg.species.some(s => key(s.category, s.name) === k)) cfg.species.push({category:c, name:name, points:1});
  sel.set(k, {category:c, species:name, count:1});
  cat = c; query = ''; $('q').value = ''; $('addform').hidden = true; renderLog();
  toast(name + ' added to ' + c);
}

function updateBar(){
  const n = sel.size, onLog = $('view-log').classList.contains('on');
  $('savebar').classList.toggle('on', n > 0 && onLog);
  $('sum').textContent = n + ' species selected';
}
function clearSel(){ sel.clear(); renderLog(); }

function saveSel(){
  const course = $('course').value, group = $('group').value;
  const observer = tidyName($('name').value);
  if (!observer){ toast('Type your name first'); $('name').focus(); window.scrollTo(0, 0); return; }
  if (!group){ toast('Choose your group first'); return; }
  prefs.name = observer; store(PKEY, prefs);
  const base = { date: $('date').value || today(), course, group, observer, activity: segVal('activity'), session: segVal('session'), notes: $('notes').value.trim() };
  sel.forEach(v => queue.push(Object.assign({ id: uid(), category: v.category, species: v.species, count: v.count }, base)));
  store(QKEY, queue);
  const n = sel.size; sel.clear(); $('notes').value = '';
  renderLog(); updateStatus(); renderResults();
  toast(n + (n === 1 ? ' sighting' : ' sightings') + ' saved for ' + observer);
  flush();
}

// ── SYNC (works with weak signal: saves on the phone first, sends when it can) ──
function flush(){
  if (sending || !queue.length){ updateStatus(); return; }
  sending = true; updateStatus();
  const batch = queue.slice(0, 150);
  api('save', { items: batch }).then(res => {
    sending = false;
    const done = new Set(res.ids);
    queue = queue.filter(q => !done.has(q.id)); store(QKEY, queue);
    store(SKEY, Date.now());
    updateStatus(); loadResults();
    if (queue.length) flush();
  }).catch(() => { sending = false; updateStatus(); });
}
function lastSync(){ const t = load(SKEY, 0); return t ? new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'never'; }
function updateStatus(){
  const s = $('status');
  if (sending){ s.className = 'status warn'; s.textContent = 'Sending ' + queue.length + '…'; return; }
  if (queue.length){ s.className = 'status warn'; s.textContent = queue.length + ' on phone, not sent yet'; return; }
  s.className = 'status'; s.textContent = navigator.onLine ? 'All sent' : 'Offline';
}

// ── RESULTS ──
function loadResults(){
  const code = $('course').value;
  if (!code) return;
  const cached = load(RKEY + code, null);
  if (cached && (!results || results.course !== code)){ results = cached; fillPeriods(); renderResults(); renderList(); }
  if (!results) results = { course: code, rows: [], points: {}, local: true };
  api('results', { course: code }).then(r => {
    r.fetchedAt = Date.now(); store(RKEY + code, r); store(SKEY, Date.now());
    if (r.course !== $('course').value) return;
    results = r; fillPeriods(); renderResults(); renderList(); updateStatus();
  }).catch(() => { renderResults(); });
}

function allRows(){
  const code = $('course').value;
  const saved = results && results.course === code ? results.rows : [];
  const pend = queue.filter(q => q.course === code).map(q => Object.assign({ pending: true, loggedAt: Infinity }, q));
  return saved.concat(pend);
}
function pts(r){ return (results && results.points[key(r.category, r.species)]) || (cfg.species.find(s => key(s.category, s.name) === key(r.category, r.species)) || {}).points || 1; }

function fillPeriods(){
  const dates = [...new Set(allRows().map(r => r.date))].sort().reverse();
  if (period !== 'all' && !dates.includes(period)) period = 'all';
  $('period').innerHTML = '<option value="all">Whole course</option>' + dates.map(d => '<option value="' + d + '">' + (d === today() ? 'Today' : niceDate(d)) + '</option>').join('');
  $('period').value = period;
}

function tally(rows, idOf){
  const M = {};
  rows.forEach(r => {
    const id = idOf(r); if (!id) return;
    const k = key(r.category, r.species), m = M[id] || (M[id] = { keys: new Set(), trips: new Set(), cats: {} });
    m.keys.add(k);
    m.trips.add(r.date + '|' + r.session + '|' + k);            // one animal, one drive = one sighting
    (m.cats[r.category] = m.cats[r.category] || new Set()).add(k);
  });
  return M;
}
function blank(){ return { keys: new Set(), trips: new Set(), cats: {} }; }

function boardHTML(ids, M, ptOf, nameOf, subOf, colorOfId, limit){
  const pts = m => [...m.keys].reduce((a, k) => a + (ptOf[k] || 1), 0);
  const score = id => scoreMode === 'species' ? M[id].keys.size : scoreMode === 'sightings' ? M[id].trips.size : pts(M[id]);
  const ranked = ids.slice().sort((a, b) => score(b) - score(a) || String(nameOf(a)).localeCompare(nameOf(b)));
  const max = Math.max(1, ...ranked.map(score)), top = ranked.length ? score(ranked[0]) : 0;
  let rank = 0, prev = null, h = '<ol class="board">';
  ranked.forEach((id, i) => {
    const s = score(id); if (s !== prev){ rank = i + 1; prev = s; }
    const m = M[id], p = pts(m);
    h += '<li class="row"' + (limit && i >= limit ? ' hidden data-extra' : '') + '><span class="rk">' + rank + '</span><div><div class="gn">' + esc(nameOf(id)) + (s === top && s > 0 ? '<em>Leading</em>' : '') + '</div>' +
      '<div class="meta">' + (subOf ? esc(subOf(id)) + ', ' : '') + m.keys.size + ' species, ' + p + (p === 1 ? ' point, ' : ' points, ') + m.trips.size + (m.trips.size === 1 ? ' sighting' : ' sightings') + '</div></div>' +
      '<span class="sc">' + s + '</span><div class="track"><i style="width:' + (s / max * 100) + '%;background:' + colorOfId(id) + '"></i></div></li>';
  });
  h += '</ol>';
  if (limit && ranked.length > limit) h += '<button class="more" onclick="this.previousElementSibling.querySelectorAll(\'[data-extra]\').forEach(x => x.hidden = false); this.remove()">Show all ' + ranked.length + '</button>';
  return h;
}

function renderResults(){
  if (!results) return;
  fillPeriods();
  const all = allRows();
  const rows = period === 'all' ? all : all.filter(r => r.date === period);
  const gs = groupsForCourse(all);
  const body = $('res-body');
  const asOf = results.fetchedAt ? new Date(results.fetchedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : null;
  let h = '<p class="sub" style="margin:14px 0 0">' + (asOf ? 'Everyone\'s sightings as of ' + asOf + '. Yours update instantly.' : 'Connect to camp Wi-Fi to see everyone else\'s sightings.') + '</p>';
  if (!rows.length){ body.innerHTML = h + '<div class="empty" style="margin-top:18px">No sightings logged ' + (period === 'all' ? 'for this course yet' : 'on this day') + '. Open Log sightings to add the first ones.</div>'; renderMe(); return; }

  const ptOf = {}; rows.forEach(r => ptOf[key(r.category, r.species)] = pts(r));
  const G = tally(rows, r => r.group); gs.forEach(g => { if (!G[g]) G[g] = blank(); });
  const P = tally(rows, r => norm(r.observer));
  const pName = {}, pGroup = {};
  rows.forEach(r => { const n = norm(r.observer); if (n){ pName[n] = pName[n] || r.observer; pGroup[n] = r.group; } });
  const total = new Set(), catTotal = {}, seenBy = {};
  rows.forEach(r => { const k = key(r.category, r.species); total.add(k); (catTotal[r.category] = catTotal[r.category] || new Set()).add(k); (seenBy[k] = seenBy[k] || new Set()).add(r.group); });
  const periodLabel = period === 'all' ? 'on ' + esc($('course').value) : (period === today() ? 'today' : 'on ' + niceDate(period));
  const people = Object.keys(P);

  h += '<div class="hero"><div class="big">' + total.size + '</div><p>species recorded ' + periodLabel + ' by ' + people.length + (people.length === 1 ? ' person' : ' people') + ' in ' + gs.length + (gs.length === 1 ? ' group' : ' groups') + '</p>' +
    '<div class="tally">' + cfg.categories.map(c => '<div><b>' + (catTotal[c] ? catTotal[c].size : 0) + '</b><span>' + esc(c) + '</span></div>').join('') + '</div></div>';

  const modeTxt = {
    species: 'Ranked by number of different species seen',
    points: 'Ranked by points. Rarer animals score more (set in the Species sheet)',
    sightings: 'Ranked by sightings. An animal counts once per drive or walk, however many people logged it'
  }[scoreMode];
  h += '<h2>Group leaderboard</h2><p class="sub">' + modeTxt + '</p>' +
    boardHTML(gs, G, ptOf, g => g, null, g => colorOf(g, gs));
  if (people.length){
    h += '<h2>Individual leaderboard</h2><p class="sub">' + modeTxt + '</p>' +
      boardHTML(people, P, ptOf, n => pName[n], n => pGroup[n], n => colorOf(pGroup[n], gs), 10);
  }

  h += '<h2>By category</h2><p class="sub">Different species per group. The category leader is highlighted.</p><div class="tbl-wrap"><table><thead><tr><th>Category</th>' +
    gs.map(g => '<th><span class="dot" style="background:' + colorOf(g, gs) + '"></span>' + esc(g) + '</th>').join('') + '</tr></thead><tbody>';
  cfg.categories.forEach(c => {
    const vals = gs.map(g => G[g].cats[c] ? G[g].cats[c].size : 0), m = Math.max(...vals);
    h += '<tr><td>' + esc(c) + '</td>' + vals.map(v => '<td class="' + (v === m && v > 0 ? 'lead' : '') + '">' + v + '</td>').join('') + '</tr>';
  });
  h += '</tbody></table></div>';

  const ex = {}; Object.keys(seenBy).forEach(k => { if (seenBy[k].size === 1){ const g = [...seenBy[k]][0]; (ex[g] = ex[g] || []).push(k); } });
  if (gs.length > 1 && Object.keys(ex).length){
    const nameOf = {}; rows.forEach(r => nameOf[key(r.category, r.species)] = r.species);
    h += '<h2>Only one group saw these</h2><p class="sub">Bragging rights</p><div class="excl">' +
      gs.filter(g => ex[g]).map(g => '<div><h3><span class="dot" style="background:' + colorOf(g, gs) + '"></span>' + esc(g) + ' (' + ex[g].length + ')</h3><ul>' +
        ex[g].map(k => nameOf[k]).sort().map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></div>').join('') + '</div>';
  }

  if (period === 'all'){
    const byDay = {}, first = {};
    all.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(r => {
      const k = key(r.category, r.species);
      (byDay[r.date] = byDay[r.date] || { sp: new Set(), fresh: new Set() });
      byDay[r.date].sp.add(k);
      if (!first[k]){ first[k] = r.date; byDay[r.date].fresh.add(k); }
    });
    let run = 0;
    h += '<h2>Day by day</h2><p class="sub">How the course list grew</p><div class="tbl-wrap"><table><thead><tr><th>Day</th><th>Species seen</th><th>New to the list</th><th>Course total</th></tr></thead><tbody>' +
      Object.keys(byDay).sort().map(d => { run += byDay[d].fresh.size; return '<tr><td>' + niceDate(d) + '</td><td>' + byDay[d].sp.size + '</td><td>' + byDay[d].fresh.size + '</td><td>' + run + '</td></tr>'; }).join('') +
      '</tbody></table></div>';
  }

  const info = {};
  rows.slice().sort((a, b) => a.date.localeCompare(b.date) || a.loggedAt - b.loggedAt).forEach(r => {
    const k = key(r.category, r.species);
    if (!info[k]) info[k] = { name: r.species, cat: r.category, first: r.date, by: r.observer ? r.observer + ', ' + r.group : r.group, groups: new Set() };
    info[k].groups.add(r.group);
  });
  h += '<h2>Species list</h2><p class="sub">Everything seen, and who saw it first</p><div class="check">';
  cfg.categories.concat(Object.values(info).map(i => i.cat)).filter((c, i, a) => a.indexOf(c) === i).forEach(c => {
    const items = Object.values(info).filter(i => i.cat === c).sort((a, b) => a.name.localeCompare(b.name));
    if (!items.length) return;
    h += '<h3>' + esc(c) + ' (' + items.length + ')</h3><ul>' + items.map(i =>
      '<li><span class="nm">' + esc(i.name) + '<br><span class="fs">First: ' + esc(i.by) + ', ' + niceDate(i.first) + '</span></span><span class="dots">' +
      gs.filter(g => i.groups.has(g)).map(g => '<span class="dot" title="' + esc(g) + '" style="background:' + colorOf(g, gs) + '"></span>').join('') + '</span></li>').join('') + '</ul>';
  });
  h += '</div>';

  const me = myName();
  const rec = rows.slice().sort((a, b) => b.loggedAt - a.loggedAt).slice(0, 20);
  h += '<h2>Latest entries</h2><p class="sub">You can remove your own entries (tap Remove twice). Instructors can edit anything in the Google Sheet.</p><ul class="recent">' + rec.map(r =>
    '<li><span class="dot" style="background:' + colorOf(r.group, gs) + '"></span><span class="nm">' + esc(r.species) + (r.count > 1 ? ' ×' + r.count : '') +
    '<small>' + esc(r.observer || '') + (r.observer ? ', ' : '') + esc(r.group) + ', ' + niceDate(r.date) + ', ' + esc(r.activity) + ' ' + esc(r.session).toLowerCase() + (r.notes ? ', ' + esc(r.notes) : '') + '</small></span>' +
    (r.pending ? '<span class="wait">Waiting</span>' : '') +
    (r.pending || (me && norm(r.observer) === me) ? '<button class="del" data-id="' + esc(r.id) + '">Remove</button>' : '') + '</li>').join('') + '</ul>';

  body.innerHTML = h;
  body.querySelectorAll('.del').forEach(b => b.onclick = () => removeEntry(b));
  renderMe();
}

// ── Printable report ──
function printResults(){
  if (!results || !cfg){ toast('Results are still loading'); return; }
  const all = allRows();
  const rows = period === 'all' ? all : all.filter(r => r.date === period);
  if (!rows.length){ toast('Nothing to print yet'); return; }
  const code = $('course').value, gs = groupsForCourse(all);
  const ptOf = {}; rows.forEach(r => ptOf[key(r.category, r.species)] = pts(r));
  const sumPts = m => [...m.keys].reduce((a, k) => a + (ptOf[k] || 1), 0);
  const G = tally(rows, r => r.group); gs.forEach(g => { if (!G[g]) G[g] = blank(); });
  const P = tally(rows, r => norm(r.observer)), pName = {}, pGroup = {};
  rows.forEach(r => { const n = norm(r.observer); if (n){ pName[n] = pName[n] || r.observer; pGroup[n] = r.group; } });
  const total = new Set(), catTotal = {}, seenBy = {}, trips = new Set(), info = {};
  rows.slice().sort((a, b) => a.date.localeCompare(b.date) || a.loggedAt - b.loggedAt).forEach(r => {
    const k = key(r.category, r.species);
    total.add(k); (catTotal[r.category] = catTotal[r.category] || new Set()).add(k);
    (seenBy[k] = seenBy[k] || new Set()).add(r.group);
    trips.add(r.group + '|' + r.date + '|' + r.session + '|' + k);
    if (!info[k]) info[k] = { name: r.species, cat: r.category, first: r.date, by: r.observer ? r.observer + ' (' + r.group + ')' : r.group, groups: new Set() };
    info[k].groups.add(r.group);
  });
  const dates = [...new Set(rows.map(r => r.date))].sort();
  const fmt = d => { const p = d.split('-'); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
  const range = period === 'all' ? (dates.length > 1 ? fmt(dates[0]) + ' – ' + fmt(dates[dates.length - 1]) : fmt(dates[0])) : fmt(period);
  const rank = (ids, M) => ids.slice().sort((a, b) => M[b].keys.size - M[a].keys.size || sumPts(M[b]) - sumPts(M[a]) || M[b].trips.size - M[a].trips.size);
  const gRank = rank(gs, G), people = rank(Object.keys(P), P).slice(0, 10);
  const gMax = Math.max(1, ...gs.map(g => G[g].keys.size)), pMax = Math.max(1, ...people.map(n => P[n].keys.size));
  const col = g => colorOf(g, gs);
  const place = (arr, i, val) => { let r = i; while (r > 0 && val(arr[r - 1]) === val(arr[i])) r--; return r + 1; };

  let h = '<div class="ps-page">';
  h += '<div class="ps-head"><img src="logo.png" alt="African Guide Academy" onerror="this.remove()"><div class="ps-title"><h1>Sightings Report</h1><p><b>' + esc(code) + '</b> · ' + range + '</p></div></div>';
  h += '<div class="ps-kpis">' +
    '<div class="ps-kpi"><b>' + total.size + '</b><span>species recorded</span></div>' +
    '<div class="ps-kpi"><b>' + trips.size + '</b><span>sightings</span></div>' +
    '<div class="ps-kpi"><b>' + dates.length + '</b><span>' + (dates.length === 1 ? 'day' : 'days') + ' in the field</span></div>' +
    '<div class="ps-kpi"><b>' + Object.keys(P).length + '</b><span>people logging</span></div></div>';
  h += '<div class="ps-cats">' + cfg.categories.map(c => '<div><b>' + (catTotal[c] ? catTotal[c].size : 0) + '</b><span>' + esc(c) + '</span></div>').join('') + '</div>';

  // standings
  h += '<div class="ps-cols"><div class="ps-sec"><h2>Group standings</h2><p class="note">Ranked by different species. Each animal counts once per group per drive or walk.</p><table class="ps-tbl"><thead><tr><th>#</th><th style="text-align:left">Group</th><th>Species</th><th>Points</th><th>Sightings</th></tr></thead><tbody>' +
    gRank.map((g, i) => { const r = place(gRank, i, x => G[x].keys.size + '|' + sumPts(G[x]) + '|' + G[x].trips.size);
      return '<tr' + (r === 1 ? ' class="win"' : '') + '><td><span class="ps-rank' + (r === 1 ? ' r1' : '') + '">' + r + '</span></td><td class="nm"><span class="ps-dot" style="background:' + col(g) + '"></span>' + esc(g) +
        '<div class="ps-bar"><i style="width:' + (G[g].keys.size / gMax * 100) + '%;background:' + col(g) + '"></i></div></td><td><b>' + G[g].keys.size + '</b></td><td>' + sumPts(G[g]) + '</td><td>' + G[g].trips.size + '</td></tr>'; }).join('') +
    '</tbody></table></div>';
  h += '<div class="ps-sec"><h2>Top spotters</h2><p class="note">Individual species lists' + (Object.keys(P).length > 10 ? ', top 10' : '') + '</p><table class="ps-tbl"><thead><tr><th>#</th><th style="text-align:left">Name</th><th>Species</th><th>Points</th></tr></thead><tbody>' +
    (people.length ? people.map((n, i) => { const r = place(people, i, x => P[x].keys.size + '|' + sumPts(P[x]) + '|' + P[x].trips.size);
      return '<tr' + (r === 1 ? ' class="win"' : '') + '><td><span class="ps-rank' + (r === 1 ? ' r1' : '') + '">' + r + '</span></td><td class="nm">' + esc(pName[n]) + '<small><span class="ps-dot" style="background:' + col(pGroup[n]) + ';margin:0 .8mm 0 0"></span>' + esc(pGroup[n]) + '</small></td><td><b>' + P[n].keys.size + '</b></td><td>' + sumPts(P[n]) + '</td></tr>'; }).join('')
      : '<tr><td colspan="4">No names recorded yet</td></tr>') +
    '</tbody></table></div></div>';

  // growth chart
  if (period === 'all' && dates.length > 1){
    const seen = new Set(), daily = [], cum = [];
    const perGroup = {}; gs.forEach(g => perGroup[g] = { set: new Set(), pts: [] });
    dates.forEach(d => {
      const day = rows.filter(r => r.date === d);
      const today = new Set(day.map(r => key(r.category, r.species)));
      today.forEach(k => seen.add(k)); daily.push(today.size); cum.push(seen.size);
      gs.forEach(g => { day.filter(r => r.group === g).forEach(r => perGroup[g].set.add(key(r.category, r.species))); perGroup[g].pts.push(perGroup[g].set.size); });
    });
    const W = 700, H = 170, L = 34, R = 30, T = 22, B = 30, pad = 18, n = dates.length, ymax = Math.max(...cum) || 1;
    const x = i => L + pad + (n === 1 ? 0 : i * (W - L - R - pad) / (n - 1)), y = v => T + (H - T - B) * (1 - v / ymax);
    const step = Math.max(1, Math.ceil(ymax / 5 / 5) * 5);
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Jost, sans-serif" font-size="10">';
    for (let v = 0; v <= ymax; v += step) svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#EFE3D1"/><text x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" fill="#8A7560">' + v + '</text>';
    const bw = Math.min(18, (W - L - R) / n * 0.5);
    daily.forEach((v, i) => svg += '<rect x="' + (x(i) - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' + (y(0) - y(v)) + '" fill="#EAD9BF" rx="2"/>');
    gs.forEach(g => { if (!perGroup[g].set.size) return; svg += '<polyline fill="none" stroke="' + col(g) + '" stroke-width="1.6" stroke-dasharray="4 3" points="' + perGroup[g].pts.map((v, i) => x(i) + ',' + y(v)).join(' ') + '"/>'; });
    svg += '<polyline fill="none" stroke="' + getComputedStyle(document.documentElement).getPropertyValue('--burgundy').trim() + '" stroke-width="3" points="' + cum.map((v, i) => x(i) + ',' + y(v)).join(' ') + '"/>';
    const every = Math.ceil(n / 12);
    dates.forEach((d, i) => { if (i % every === 0 || i === n - 1){ const p = d.split('-'); svg += '<text x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle" fill="#5a4636">' + new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</text>'; } });
    svg += '<text x="' + (W - R) + '" y="' + (y(cum[n - 1]) - 6) + '" text-anchor="end" font-weight="700" fill="#2B1D14">' + cum[n - 1] + ' species</text></svg>';
    h += '<div class="ps-sec ps-chart"><h2>How the list grew</h2><p class="note">Solid line: course total. Dashed lines: each group. Bars: species seen that day.</p>' + svg + '</div>';
  }

  // champions + stars
  const champs = cfg.categories.map(c => {
    const vals = gs.map(g => G[g].cats[c] ? G[g].cats[c].size : 0), m = Math.max(0, ...vals);
    return { c: c, m: m, who: m ? gs.filter((g, i) => vals[i] === m) : [] };
  });
  const stars = Object.keys(info).sort((a, b) => (ptOf[b] || 1) - (ptOf[a] || 1) || info[a].name.localeCompare(info[b].name)).slice(0, 12);
  const foot = '<div class="ps-foot"><span>African Guide Academy · ' + esc(code) + '</span><span>Printed ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + '</span></div>';
  h += foot + '</div><div class="ps-page"><div class="ps-head"><img src="logo.png" alt="" onerror="this.remove()"><div class="ps-title"><h1>Highlights</h1><p><b>' + esc(code) + '</b> · ' + range + '</p></div></div>';
  h += '<div class="ps-cols"><div class="ps-sec"><h2>Category champions</h2><table class="ps-tbl"><thead><tr><th style="text-align:left">Category</th><th style="text-align:left">Leading group</th><th>Species</th></tr></thead><tbody>' +
    champs.map(x => '<tr><td>' + esc(x.c) + '</td><td class="nm" style="font-weight:500">' + (x.who.length ? x.who.map(g => '<span class="ps-dot" style="background:' + col(g) + '"></span>' + esc(g)).join(', ') : '<span style="color:#8A7560">None yet</span>') + '</td><td><b>' + x.m + '</b></td></tr>').join('') +
    '</tbody></table></div>';
  h += '<div class="ps-sec"><h2>Star sightings</h2><p class="note">Highest-scoring species, and who saw them first</p>' +
    stars.map(k => '<div class="ps-star"><b>' + esc(info[k].name) + '</b><span>' + (ptOf[k] || 1) + ((ptOf[k] || 1) === 1 ? ' pt' : ' pts') + '</span><small>' + esc(info[k].by) + ', ' + fmt(info[k].first) + '</small></div>').join('') + '</div></div>';

  // exclusives
  const ex = {}; Object.keys(seenBy).forEach(k => { if (seenBy[k].size === 1){ const g = [...seenBy[k]][0]; (ex[g] = ex[g] || []).push(info[k].name); } });
  if (gs.length > 1 && Object.keys(ex).length){
    h += '<div class="ps-sec" style="break-inside:auto;margin-top:5mm"><h2>Only one group saw these</h2><div class="ps-excl">' +
      gs.filter(g => ex[g]).map(g => '<div><b><span class="ps-dot" style="background:' + col(g) + '"></span>' + esc(g) + ' (' + ex[g].length + ')</b>' + ex[g].sort().map(esc).join(', ') + '</div>').join('') + '</div></div>';
  }
  h += foot + '</div>';

  // species list: full list
  h += '<div class="ps-page"><div class="ps-head"><img src="logo.png" alt="" onerror="this.remove()"><div class="ps-title"><h1>Species List</h1><p><b>' + esc(code) + '</b> · ' + total.size + ' species · ' + range + '</p></div></div><div class="ps-list">';
  cfg.categories.concat(Object.values(info).map(i => i.cat)).filter((c, i, a) => a.indexOf(c) === i).forEach(c => {
    const items = Object.values(info).filter(i => i.cat === c).sort((a, b) => a.name.localeCompare(b.name));
    if (!items.length) return;
    h += '<h3>' + esc(c) + ' (' + items.length + ')</h3>' + items.map(i => '<p><span>' + esc(i.name) + '</span><span>' + gs.filter(g => i.groups.has(g)).map(g => '<span class="ps-dot" style="background:' + col(g) + ';margin:0 0 0 .6mm"></span>').join('') + '</span></p>').join('');
  });
  h += '</div><p class="note" style="margin-top:4mm;font-size:7.5pt;color:#8A7560">Dots show which groups saw each species: ' + gs.map(g => '<span class="ps-dot" style="background:' + col(g) + '"></span>' + esc(g)).join(' &nbsp; ') + '</p>' + foot + '</div>';

  $('print-sheet').innerHTML = h;
  const imgs = [...$('print-sheet').querySelectorAll('img')];
  Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))).then(() => setTimeout(() => window.print(), 150));
}

function renderMe(){
  const el = $('me-body'); if (!el || !cfg) return;
  const me = myName();
  if (!me){ el.innerHTML = '<div class="empty" style="margin-top:18px">Type your name on the Log sightings tab, and your personal species list will build up here.</div>'; return; }
  const rows = allRows().filter(r => norm(r.observer) === me);
  const shown = tidyName($('name').value || prefs.name);
  if (!rows.length){ el.innerHTML = '<p class="me-name">' + esc(shown) + '</p><div class="empty" style="margin-top:12px">No sightings logged under this name on ' + esc($('course').value) + ' yet.</div>'; return; }
  const info = {}, catTotal = {};
  rows.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(r => {
    const k = key(r.category, r.species);
    const i = info[k] || (info[k] = { name: r.species, cat: r.category, first: r.date, trips: new Set() });
    i.trips.add(r.date + '|' + r.session);
    (catTotal[r.category] = catTotal[r.category] || new Set()).add(k);
  });
  const P = Object.keys(info).reduce((a, k) => a + pts({ category: info[k].cat, species: info[k].name }), 0);
  let h = '<p class="me-name">' + esc(shown) + '</p><div class="hero" style="margin-top:6px"><div class="big">' + Object.keys(info).length + '</div><p>species on your list for ' + esc($('course').value) + ', worth ' + P + (P === 1 ? ' point' : ' points') + '</p>' +
    '<div class="tally">' + cfg.categories.map(c => '<div><b>' + (catTotal[c] ? catTotal[c].size : 0) + '</b><span>' + esc(c) + '</span></div>').join('') + '</div></div><div class="check">';
  cfg.categories.concat(Object.values(info).map(i => i.cat)).filter((c, i, a) => a.indexOf(c) === i).forEach(c => {
    const items = Object.values(info).filter(i => i.cat === c).sort((a, b) => a.name.localeCompare(b.name));
    if (!items.length) return;
    h += '<h3>' + esc(c) + ' (' + items.length + ')</h3><ul>' + items.map(i =>
      '<li><span class="nm">' + esc(i.name) + '<br><span class="fs">First seen ' + niceDate(i.first) + '</span></span><span class="times">' + i.trips.size + (i.trips.size === 1 ? ' drive/walk' : ' drives/walks') + '</span></li>').join('') + '</ul>';
  });
  el.innerHTML = h + '</div>';
}

function removeEntry(b){
  const id = b.dataset.id;
  if (armed !== id){ armed = id; body().querySelectorAll('.del').forEach(x => { x.classList.remove('arm'); x.textContent = 'Remove'; });
    b.classList.add('arm'); b.textContent = 'Tap again'; setTimeout(() => { if (armed === id){ armed = null; b.classList.remove('arm'); b.textContent = 'Remove'; } }, 3000); return; }
  armed = null;
  const qi = queue.findIndex(q => q.id === id);
  if (qi >= 0){ queue.splice(qi, 1); store(QKEY, queue); updateStatus(); renderResults(); renderList(); toast('Removed'); return; }
  b.disabled = true; b.textContent = 'Removing…';
  api('delete', { id: id }).then(() => {
    results.rows = results.rows.filter(r => r.id !== id); store(RKEY + results.course, results);
    renderResults(); renderList(); toast('Removed');
  }).catch(() => { b.disabled = false; b.textContent = 'Remove'; toast('Removing needs a connection. Try again at camp.'); });
}
function body(){ return $('res-body'); }
</script>
